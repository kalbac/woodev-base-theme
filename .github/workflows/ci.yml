name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # The supported floor (ADR-003), not a convenience version: CI must
          # exercise the oldest PHP the theme claims to run on.
          php-version: '8.1'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer phpcs
      - run: composer phpstan
      - run: composer test:unit

  js-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run format
      # theme.json and inc/generated/palettes.php are generated from
      # src/tokens/tokens.mjs and committed. Editing either by hand passes every
      # other gate here and is then erased by the next build — s15 lost a change
      # exactly that way. Read-only: it never rewrites the tree.
      - run: npm run tokens:check
      - run: npm run test:js
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: theme-dist
          path: woodev-base-theme/assets/dist

  php-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The asset tests resolve hashed filenames through the Vite manifest and
      # markTestSkipped() without one. Without this step CI silently skipped
      # four of them — a green job covering less than it appeared to, which is
      # docs/gotchas/qa-gates-cover-less-than-they-claim.md in its purest form.
      - run: npm run build
      # A config file of its own, so this spawns its own container set and
      # cannot collide with the e2e job's environment. See .wp-env.test.json.
      - run: npm run wp:test:start
      # Composer runs inside the container on purpose: it is the PHP that will
      # execute the suite, so the resolved platform matches by construction
      # instead of by the runner happening to agree.
      - run: npm run test:integration:install
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    needs: js-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wp-env start
      - run: npx wp-env run cli wp theme activate woodev-base-theme
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
